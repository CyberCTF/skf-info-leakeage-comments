# yaml-language-server: $schema=https://www.isoloom.com/schema/v1.json
# OWASP SKF Information Leakage in Comments (OWASP Security Knowledge Framework labs, by Glenn ten Cate, Riccardo ten Cate and the SKF contributors) as an Isoloom spec:
# a Flask login page that leaves sensitive information in its HTML comments (information disclosure). The SKF lab folder python/info-leakeage-comments is
# vendored unchanged in app/ and built by its own Dockerfile.
# `isoloom generate`, then `isoloom run docker`.
version: 1
name: skf-info-leakeage-comments

networks:
  lab: { cidr: 10.60.162.0/24, internet: false }

machines:
  web:
    networks: { lab: 10 }
    services: [{ port: 5000, name: web, http: true, publish: 5050 }]
    resources: { cpus: 1, memory_mb: 256 }
    docker:
      build: app

checks:
  - name: the lab answers
    http: http://web:5000/
    wait: 120
  - name: the login form posts to /login
    script: checks/login.sh

message: |
  OWASP SKF Information Leakage in Comments answers at http://localhost:{{ machines.web.services.0.publish }}/.
  The page shows a login form. The browser does not show everything the server sent.
